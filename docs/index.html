<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장에 답하다 | 역사 읽기</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./config.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header><div><span>역사 읽기 활동</span><strong>문장에 답하다</strong></div><div><p id="status" role="status"></p><button id="switch-room" type="button" hidden>학급 바꾸기</button></div></header>
<main>
<section class="intro">
<p class="topic">『나의 투쟁』 비판적 읽기</p>
<h1>어디에서 논리가<br>건너뛰었을까?</h1>
<p>가장 납득하기 어려운 구절을 고르고, 그 주장이 왜 설득력이 없는지 댓글을 남겨 보세요.</p>
</section>
<div class="layout">
<article aria-label="읽기 자료">
<h2>읽기 자료</h2>
<p class="muted">제공된 영상 스크립트에서 히틀러의 주장을 비판적으로 요약했어요. 원문 인용은 따로 사용하지 않았어요.</p>
<div id="reading"></div>
<a href="https://www.youtube.com/watch?v=4xbwBdyCE3Q">출처 영상 보기 ↗</a>
</article>
<aside aria-label="학급 댓글">
<h2>학급 댓글</h2>
<form id="join" hidden>
<label for="code">학급 참여 코드</label>
<input id="code" required autocomplete="off" placeholder="선생님이 공유한 코드">
<button>입장하기</button>
</form>
<div id="discussion" hidden>
<p id="prompt" class="muted">글에서 반박하고 싶은 구절을 드래그하고 ‘선택한 구절로 댓글 쓰기’를 눌러 보세요. 문단 끝 버튼으로 문단 전체를 고를 수도 있어요.</p>
<button type="button" id="use-selection">선택한 구절로 댓글 쓰기</button>
<form id="compose" hidden>
<blockquote id="picked"></blockquote>
<label for="alias">별명</label>
<input id="alias" maxlength="24" required placeholder="실명 대신 수업용 별명">
<label for="body">나의 반박</label>
<textarea id="body" rows="4" maxlength="1000" required placeholder="이 주장은 …을 전제로 하지만, … 때문에 설득력이 없다."></textarea>
<button>댓글 남기기</button>
</form>
<div id="comments"></div>
</div>
<p id="notice" role="status"></p>
</aside>
</div>
</main>
</body>
</html>
